services:
  root:
    image: ${BWRAP_AGENT_TEST_IMAGE}
    user: "0:0"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command:
      - /bin/sh
      - -ec
      - 'test "$$(id -u)" = 0; test -r README.md; echo compose-root-ok'

  nonroot:
    image: ${BWRAP_AGENT_TEST_IMAGE}
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command:
      - /bin/sh
      - -ec
      - 'test "$$(id -u)" = 1000; test "$$(id -g)" = 1000; test -r README.md; echo compose-nonroot-ok'
